services:
  mysql:
    image: mysql:8.4
    container_name: radiadores-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: radiadores_db
      MYSQL_USER: radiadores
      MYSQL_PASSWORD: radiadores123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: